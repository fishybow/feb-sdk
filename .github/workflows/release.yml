name: Build and Release FEB Games

on:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      tag_name:
        description: 'Tag / version name (leave blank for today date yy.mm.dd)'
        required: false
        default: ''
      draft:
        description: 'Publish as draft release'
        required: false
        type: boolean
        default: false
      prerelease:
        description: 'Publish as pre-release'
        required: false
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  build:
    name: Build & Test
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Run verification test suite
        run: make test

      - name: Build all FEB games & package distribution
        run: make dist

      - name: Verify build artifacts
        run: |
          echo "=== Verifying Built Artifacts ==="
          ls -lh dist/
          test -f dist/2048.feb || { echo "Missing 2048.feb"; exit 1; }
          test -f dist/flappy_bird.feb || { echo "Missing flappy_bird.feb"; exit 1; }
          test -f dist/sokoban.feb || { echo "Missing sokoban.feb"; exit 1; }
          test -f dist/flashiibo-feb-games.zip || { echo "Missing flashiibo-feb-games.zip"; exit 1; }
          test -f dist/sha256sums.txt || { echo "Missing sha256sums.txt"; exit 1; }
          # Verify demos and template are excluded from public release distribution
          ! test -f dist/button_demo.feb || { echo "button_demo.feb should not be in release dist"; exit 1; }
          ! test -f dist/draw_demo.feb || { echo "draw_demo.feb should not be in release dist"; exit 1; }
          ! test -f dist/template.feb || { echo "template.feb should not be in release dist"; exit 1; }
          echo "All game artifacts present and verified (demos remain in examples/)."

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: flashiibo-feb-games
          path: dist/
          if-no-files-found: error
          retention-days: 14

  release:
    name: Publish Release
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    if: needs.build.result == 'success'

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Download built artifacts
        uses: actions/download-artifact@v4
        with:
          name: flashiibo-feb-games
          path: dist/

      - name: Determine Release Metadata
        id: meta
        run: |
          # 1. Check if an explicit tag was specified via workflow_dispatch
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ -n "${{ inputs.tag_name }}" ]; then
            TAG_NAME="${{ inputs.tag_name }}"
          else
            # 2. Check if a tag points directly to the commit (e.g. pushed by make publish)
            COMMIT_TAG=$(git tag --points-at HEAD | grep -E '^[0-9]{2}\.[0-9]{2}\.[0-9]{2}' | head -n 1)
            if [ -z "$COMMIT_TAG" ]; then
              COMMIT_TAG=$(git tag --points-at HEAD | head -n 1)
            fi

            if [ -n "$COMMIT_TAG" ]; then
              TAG_NAME="$COMMIT_TAG"
            else
              # 3. Fallback to today's date in yy.mm.dd format
              TAG_NAME=$(date +'%y.%m.%d')
            fi
          fi

          RELEASE_NAME="Release ${TAG_NAME}"
          DRAFT="false"
          PRERELEASE="false"

          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            DRAFT="${{ inputs.draft }}"
            PRERELEASE="${{ inputs.prerelease }}"
          fi

          echo "tag_name=${TAG_NAME}" >> "$GITHUB_OUTPUT"
          echo "release_name=${RELEASE_NAME}" >> "$GITHUB_OUTPUT"
          echo "prerelease=${PRERELEASE}" >> "$GITHUB_OUTPUT"
          echo "draft=${DRAFT}" >> "$GITHUB_OUTPUT"
          echo "make_latest=true" >> "$GITHUB_OUTPUT"

      - name: Update Git Tag
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git tag -f "${{ steps.meta.outputs.tag_name }}" "${{ github.sha }}"
          git push -f origin "${{ steps.meta.outputs.tag_name }}"

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.meta.outputs.tag_name }}
          name: ${{ steps.meta.outputs.release_name }}
          draft: ${{ steps.meta.outputs.draft == 'true' }}
          prerelease: ${{ steps.meta.outputs.prerelease == 'true' }}
          make_latest: ${{ steps.meta.outputs.make_latest }}
          generate_release_notes: true
          files: |
            dist/*.feb
            dist/flashiibo-feb-games.zip
            dist/sha256sums.txt
          body: |
            ## Flashiibo FEB Games

            Pre-compiled standalone `.feb` game executables for **Flashiibo Pro Gen3** devices running **FEB Runner** (requires firmware >= 26.10.4).

            ### 🎮 Included Games
            - **`2048.feb`**: Classic 2048 puzzle game rendered at 128×64 with direct line sliding, animated tiles, and high-score tracking.
            - **`flappy_bird.feb`**: Flappy Bird arcade game with physics, procedural pipe generation, and collision detection.
            - **`sokoban.feb`**: 10-level Sokoban box-pushing puzzle game with immovable blocks and progress saving to flash storage.
            - **`flashiibo-feb-games.zip`**: Complete bundle archive containing all game `.feb` binaries and instructions.
            - **`sha256sums.txt`**: SHA-256 verification checksums for all release binaries.

            *(Note: Developer demos and starter templates remain available directly in the [source repository examples](https://github.com/fishybow/feb-sdk/tree/main/examples)).*

            ---

            ### 📲 How to Install & Play on Flashiibo
            1. Connect your **Flashiibo Pro Gen3** to your computer or phone via USB or Web Bluetooth using **Flashiibo Pro Tools** (Web or Mobile).
            2. Upload any `.feb` file into the `/feb/` folder on your device's flash storage.
            3. On your Flashiibo, scroll to **FEB Runner**, select your game, and press **OK**!

            > [!TIP]
            > **Emergency Exit Chord:** Press **UP + DOWN** simultaneously at any time to return immediately to the FEB Runner menu.
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
