name: Build and Release FEB Games

on:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      tag_name:
        description: 'Tag / version name (leave blank for today date yy.mm.dd)'
        required: false
        default: ''
      draft:
        description: 'Publish as draft release'
        required: false
        type: boolean
        default: false
      prerelease:
        description: 'Publish as pre-release'
        required: false
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  build:
    name: Build & Test
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Run verification test suite
        run: make test

      - name: Build all FEB games & package distribution
        run: make dist

      - name: Verify build artifacts
        run: |
          echo "=== Verifying Built Artifacts ==="
          ls -lh dist/
          ls -lh dist/games/
          ls -lh dist/apps/
          ls -lh dist/demos/
          test -f dist/games/2048.feb || { echo "Missing games/2048.feb"; exit 1; }
          test -f dist/games/flappy_bird.feb || { echo "Missing games/flappy_bird.feb"; exit 1; }
          test -f dist/games/sokoban.feb || { echo "Missing games/sokoban.feb"; exit 1; }
          test -f dist/games/digital_pet.feb || { echo "Missing games/digital_pet.feb"; exit 1; }
          test -f dist/games/mastermind.feb || { echo "Missing games/mastermind.feb"; exit 1; }
          test -f dist/games/snake.feb || { echo "Missing games/snake.feb"; exit 1; }
          test -f dist/games/falling_blocks.feb || { echo "Missing games/falling_blocks.feb"; exit 1; }
          test -f dist/apps/stopwatch.feb || { echo "Missing apps/stopwatch.feb"; exit 1; }
          test -f dist/apps/flashlight.feb || { echo "Missing apps/flashlight.feb"; exit 1; }
          test -f dist/apps/sos.feb || { echo "Missing apps/sos.feb"; exit 1; }
          test -f dist/apps/dice.feb || { echo "Missing apps/dice.feb"; exit 1; }
          test -f dist/apps/dnd_dice.feb || { echo "Missing apps/dnd_dice.feb"; exit 1; }
          test -f dist/demos/template.feb || { echo "Missing demos/template.feb"; exit 1; }
          test -f dist/demos/button_demo.feb || { echo "Missing demos/button_demo.feb"; exit 1; }
          test -f dist/demos/draw_demo.feb || { echo "Missing demos/draw_demo.feb"; exit 1; }
          test -f dist/flashiibo-feb-games.zip || { echo "Missing flashiibo-feb-games.zip"; exit 1; }
          test -f dist/sha256sums.txt || { echo "Missing sha256sums.txt"; exit 1; }
          echo "All game, app, and demo artifacts present and verified."

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: flashiibo-feb-games
          path: dist/
          if-no-files-found: error
          retention-days: 14

  release:
    name: Publish Release
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    if: needs.build.result == 'success'

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Download built artifacts
        uses: actions/download-artifact@v4
        with:
          name: flashiibo-feb-games
          path: dist/

      - name: Determine Release Metadata
        id: meta
        run: |
          # 1. Check if an explicit tag was specified via workflow_dispatch
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ -n "${{ inputs.tag_name }}" ]; then
            TAG_NAME="${{ inputs.tag_name }}"
          else
            # 2. Check if a tag points directly to the commit (e.g. pushed by make publish)
            COMMIT_TAG=$(git tag --points-at HEAD | grep -E '^[0-9]{2}\.[0-9]{2}\.[0-9]{2}' | head -n 1)
            if [ -z "$COMMIT_TAG" ]; then
              COMMIT_TAG=$(git tag --points-at HEAD | head -n 1)
            fi

            if [ -n "$COMMIT_TAG" ]; then
              TAG_NAME="$COMMIT_TAG"
            else
              # 3. Fallback to today's date in yy.mm.dd format
              TAG_NAME=$(date +'%y.%m.%d')
            fi
          fi

          RELEASE_NAME="Release ${TAG_NAME}"
          DRAFT="false"
          PRERELEASE="false"

          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            DRAFT="${{ inputs.draft }}"
            PRERELEASE="${{ inputs.prerelease }}"
          fi

          echo "tag_name=${TAG_NAME}" >> "$GITHUB_OUTPUT"
          echo "release_name=${RELEASE_NAME}" >> "$GITHUB_OUTPUT"
          echo "prerelease=${PRERELEASE}" >> "$GITHUB_OUTPUT"
          echo "draft=${DRAFT}" >> "$GITHUB_OUTPUT"
          echo "make_latest=true" >> "$GITHUB_OUTPUT"

      - name: Update Git Tag
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git tag -f "${{ steps.meta.outputs.tag_name }}" "${{ github.sha }}"
          git push -f origin "${{ steps.meta.outputs.tag_name }}" || echo "Tag push skipped or already up to date"

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.meta.outputs.tag_name }}
          name: ${{ steps.meta.outputs.release_name }}
          draft: ${{ steps.meta.outputs.draft == 'true' }}
          prerelease: ${{ steps.meta.outputs.prerelease == 'true' }}
          make_latest: ${{ steps.meta.outputs.make_latest }}
          generate_release_notes: true
          files: |
            dist/games/*.feb
            dist/apps/*.feb
            dist/demos/*.feb
            dist/flashiibo-feb-games.zip
            dist/sha256sums.txt
          body: |
            ## Flashiibo FEB Games & Applications

            Pre-compiled standalone `.feb` executables for **Flashiibo Pro Gen3** devices running **FEB Runner** (requires firmware >= 26.10.6).

            ### 🎮 Included Games
            - **`2048.feb`**: Classic 2048 puzzle game rendered at 128×64 with direct line sliding, animated tiles, and high-score tracking.
            - **`flappy_bird.feb`**: Flappy Bird arcade game with physics, procedural pipe generation, and collision detection.
            - **`sokoban.feb`**: 10-level Sokoban box-pushing puzzle game with immovable blocks and progress saving to flash storage.
            - **`digital_pet.feb`**: Virtual pet simulation with real-time stats, moods, interactions, and flash storage state persistence.
            - **`mastermind.feb`**: Code-breaking deduction puzzle game.
            - **`snake.feb`**: Classic Snake arcade game.
            - **`falling_blocks.feb`**: Portrait falling blocks arcade game.

            ### 🛠️ Included Applications & Utilities
            - **`stopwatch.feb`**: Precision digital stopwatch with lap timing, state persistence, and vector arrow UI.
            - **`flashlight.feb`**: Full-brightness screen flashlight utility.
            - **`sos.feb`**: Morse code SOS emergency flashing beacon.
            - **`dice.feb`**: Standard 6-sided dice roller with shake animation.
            - **`dnd_dice.feb`**: D&D polyhedral dice roller (d4, d6, d8, d10, d12, d20, d100) with custom lining font.

            ### 🎨 Developer Demos & Templates
            - **`template.feb`**: Minimal FEB application skeleton.
            - **`button_demo.feb`**: 4-button hardware input demonstration.
            - **`draw_demo.feb`**: Vector geometry rendering primitives (rectangles, rounded rectangles, triangles, circles, lines).

            ### 📦 Distribution Archives
            - **`flashiibo-feb-games.zip`**: Complete bundle archive containing all game, app, and demo `.feb` binaries and instructions organized by category (`games/`, `apps/`, `demos/`).
            - **`sha256sums.txt`**: SHA-256 verification checksums for all release binaries.

            ---

            ### 📲 How to Install & Play on Flashiibo
            1. Connect your **Flashiibo Pro Gen3** to your computer or phone via USB or Web Bluetooth using **Flashiibo Pro Tools** (Web or Mobile).
            2. Upload any `.feb` file into the `/feb/` folder on your device's flash storage.
            3. On your Flashiibo, scroll to **FEB Runner**, select your application, and press **OK**!

            > [!TIP]
            > **Emergency Exit Chord:** Press **UP + DOWN** simultaneously at any time to return immediately to the FEB Runner menu.
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
